# =============================================================================
# NAUTILUS/RAY CRYPTO TRADING BOT - RUST WORKSPACE CONFIGURATION
# =============================================================================
# Target Architecture: AMD Ryzen AI 5 (Windows x86_64)
# Optimization Profile: Maximum single-threaded performance with LTO
# Memory Constraint: 8GB global RAM limit (4GB Python quota)
# Latency Goal: Sub-10 microsecond hot path execution
# Stage 54: Final Compilation with PGO and LTO
# =============================================================================

[workspace]
resolver = "2"
members = [
    ".",
    "src/core",
    "python/ffi",
]

[package]
name = "nautilus-ray-bot"
version = "0.1.0"
edition = "2021"
authors = ["Quantitative Trading Systems"]
description = "Ultra-low latency crypto trading bot with Ray-distributed AI"
license = "PROPRIETARY"

# Critical: Enable native CPU optimizations for AMD Ryzen architecture
[profile.release]
opt-level = 3                    # Maximum optimization level
lto = "fat"                      # Full Link Time Optimization across all crates
codegen-units = 1                # Single codegen unit for maximum inlining
target-cpu = "native"            # Auto-detect AMD Ryzen features (AVX2, FMA, BMI2)
panic = "abort"                  # Abort on panic to eliminate unwinding overhead
strip = true                     # Strip all debug symbols from binary
rpath = false                    # Disable runtime library path lookup
debug = false                    # No debug information in release build
debug-assertions = false         # Disable debug assertions
overflow-checks = false          # Disable integer overflow checks for speed
incremental = false              # Disable incremental compilation for clean builds

# PGO instrumentation profile - generates profiling data
[profile.pgo-instrument]
inherits = "release"
instrument = true                # Enable PGO instrumentation
codegen-units = 1
lto = "thin"                     # Thin LTO during instrumentation for faster builds

# PGO usage profile - applies generated profiles for optimal code layout
[profile.pgo-use]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Benchmark profile for micro-benchmarking with rdtscp
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = "line-tables-only"       # Minimal debug info for faster compilation
target-cpu = "native"

# =============================================================================
# CORE DEPENDENCIES - PINNED VERSIONS FOR REPRODUCIBILITY
# =============================================================================

[dependencies]
# Nautilus Trader - High-performance algorithmic trading library
# Pinned to specific commit for stability; update only after thorough testing
nautilus_trader = { git = "https://github.com/nautechsystems/nautilus_trader.git", tag = "v0.39.0" }

# Tokio - Async runtime for non-blocking I/O and timers
tokio = { version = "1.35", features = [
    "rt-multi-thread",            # Multi-threaded runtime for parallel task execution
    "sync",                       # Synchronization primitives (channels, mutexes)
    "time",                       # High-resolution timers for order timeouts
    "net",                        # Network I/O for WebSocket connections
    "macros",                     # Async macros for cleaner code
    "parking_lot",                # Faster parking lot implementation
], default-features = false }

# Rayon - Data parallelism for batch processing (offline training data prep)
rayon = "1.8"

# Crossbeam - Lock-free concurrent data structures for hot path
crossbeam = { version = "0.8", features = ["crossbeam-channel", "crossbeam-queue"] }
crossbeam-channel = "0.5"

# Memory-mapped file I/O for zero-copy logging
memmap2 = "0.9"

# Serialization for inter-process communication
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"                    # Faster than serde_json for internal messaging

# High-precision time handling (nanosecond resolution)
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["local-offset"] }

# Error handling with minimal overhead
thiserror = "1.0"
anyhow = "1.0"

# Environment variable parsing (compile-time verified)
dotenvy = "0.15"

# Tracing for structured telemetry (non-blocking)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Numerical computing (AMD-optimized BLAS via system links)
ndarray = "0.15"
blas-src = { version = "0.10", default-features = false }

# Cryptography for API signature generation
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Memory allocation control
tikv-jemallocator = { version = "0.5", features = ["unprefixed_malloc_on_supported_platforms"] }

# =============================================================================
# BUILD DEPENDENCIES - For compile-time code generation
# =============================================================================

[build-dependencies]
cc = "1.0"                       # C compiler integration for BLAS bindings
pkg-config = "0.3"               # System library discovery

# =============================================================================
# PLATFORM-SPECIFIC DEPENDENCIES (Windows)
# =============================================================================

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winnt",                      # Windows NT types
    "processthreadsapi",          # Process and thread management
    "memoryapi",                  # Memory management functions
    "handleapi",                  # Handle operations
    "jobapi2",                    # Job objects for process groups
]}

# =============================================================================
# FEATURE FLAGS - Conditional compilation for different deployment modes
# =============================================================================

[features]
default = ["production"]

# Production mode: Maximum optimizations, no debug output
production = []

# Paper trading mode: Simulated execution without real orders
paper_trading = []

# Verbose logging: Enable detailed telemetry (development only)
verbose_logging = []

# GPU acceleration: Enable DirectML/ROCm bindings for AI inference
gpu_acceleration = []

# =============================================================================
# PACKAGE METADATA
# =============================================================================

[package.metadata.windows]
subsystem = "console"            # Console application for CLI operation

# Linker flags for maximum performance on Windows
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+avx2",
    "-C", "target-feature=+fma",
    "-C", "target-feature=+bmi2",
    "-C", "link-arg=/STACK:8388608",  # 8MB stack size
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "target-feature=+avx2",
    "-C", "target-feature=+fma",
    "-C", "target-feature=+bmi2",
    "-C", "link-arg=-Wl,--stack,8388608",
]
