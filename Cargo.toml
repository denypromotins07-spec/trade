# Nautilus/Ray HFT Trading Bot - Stage 54
# Hyper-strict Rust compilation configuration for microsecond latency
# Optimized for AMD Ryzen AI 5 architecture with 8GB RAM constraint

[package]
name = "nautilus_hft"
version = "5.4.0"
edition = "2021"
authors = ["Quantitative Trading Team"]
description = "Ultra-low latency crypto trading engine with PGO optimization"
license = "PROPRIETARY"

# =============================================================================
# PROFILE-GUIDED OPTIMIZATION (PGO) CONFIGURATION
# =============================================================================
[profile.release]
opt-level = 3                    # Maximum optimization level
lto = "fat"                      # Full Link-Time Optimization across all crates
codegen-units = 1                # Single codegen unit for maximum inlining
panic = "abort"                  # Eliminate unwind tables, reduce binary size
strip = "symbols"                # Strip debug symbols from final binary
rpath = false                    # Disable runtime library path lookup
debug = false                    # No debug info in release builds
debug-assertions = false         # Disable debug assertions
overflow-checks = false          # Disable integer overflow checks (unsafe but fast)
incremental = false              # Disable incremental compilation for clean builds

# =============================================================================
# BENCHMARK PROFILE FOR MICRO-BENCHMARKING WITH rdtscp
# =============================================================================
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

# =============================================================================
# PGO INSTRUMENTATION PROFILE
# Used during the profiling phase to collect execution data
# =============================================================================
[profile.pgo-instrument]
inherits = "release"
pgo = true                       # Enable PGO instrumentation
codegen-units = 16               # Multiple units for faster instrumentation build

# =============================================================================
# DEPENDENCIES - Strictly pinned versions for reproducibility
# =============================================================================
[dependencies]
tokio = { version = "1.35.0", features = ["full"], default-features = false }
crossbeam = "0.8.4"
crossbeam-channel = "0.5.11"
crossbeam-queue = "0.3.11"
bumpalo = "3.14.0"
typed-arena = "2.0.2"
raw-cpuid = "11.0.0"
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
bincode = "1.3.3"
serde = { version = "1.0.193", features = ["derive"], default-features = false }
serde_json = { version = "1.0.108", features = ["preserve_order"] }
socket2 = { version = "0.5.5", features = ["all"] }
mio = { version = "0.8.10", features = ["os-poll", "net"] }
tracing = { version = "0.1.40", features = ["max_level_off", "release_max_level_off"] }
tracing-subscriber = { version = "0.3.18", default-features = false }
pyo3 = { version = "0.20.0", features = ["extension-module"], optional = true }
target-lexicon = "0.12.12"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"], default-features = false }
memmap2 = "0.9.0"
atomic-wait = "1.1.0"

[dev-dependencies]
cargo-fuzz = "0.11.2"
arbitrary = { version = "1.3.2", features = ["derive"] }
criterion = { version = "0.5.1", features = ["html_reports"] }

[build-dependencies]
vergen = { version = "8.3.1", features = ["git", "rustc", "build"] }
cc = "1.0.83"

[features]
default = ["production"]
production = []
python-ffi = ["dep:pyo3"]
fuzzing = []
benchmarking = []

[lib]
name = "nautilus_hft"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nautilus_engine"
path = "src/main.rs"

[[bin]]
name = "pgo_instrument"
path = "src/pgo_instrument.rs"
required-features = ["fuzzing"]

# =============================================================================
# RUSTC FLAGS - Passed directly to compiler
# =============================================================================
[build]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "llvm-args=-enable-mlir",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "force-frame-pointers=no",
    "-C", "merge-all-constants",
    "-A", "warnings",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=znver4",
    "-C", "prefer-dynamic",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=znver4",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
]
