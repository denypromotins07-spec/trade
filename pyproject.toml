# Nautilus/Ray HFT Bot - Python Packaging Configuration
# Stage 54: C-Extension Compilation for AMD ROCm/DirectML
# Strict build dependencies ensuring all hot-paths are pre-compiled to native code

[build-system]
requires = [
    "setuptools>=69.0.0",
    "wheel>=0.42.0",
    "Cython>=3.0.7",
    "numpy>=1.26.2",
    "numba>=0.58.1",
    "scikit-build-core>=0.7.1",
    "maturin>=1.3.2",
]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT METADATA
# =============================================================================
[project]
name = "nautilus-ray-hft"
version = "5.4.0"
description = "Ultra-low latency crypto trading AI modules for Ray cluster"
readme = "README.md"
license = {text = "PROPRIETARY"}
authors = [
    {name = "Quantitative Trading Team", email = "quant@nautilus-hft.local"}
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
]

# =============================================================================
# STRICT DEPENDENCIES - Pinned for reproducibility
# =============================================================================
dependencies = [
    # Ray cluster infrastructure
    "ray[train,serve,tune]>=2.9.0",
    "ray-default-config>=2.9.0",
    
    # Core numerical computing
    "numpy>=1.26.2,<2.0.0",
    "scipy>=1.11.4",
    
    # Numba JIT compilation for hot-paths
    "numba>=0.58.1",
    "llvmlite>=0.41.1",
    
    # Cython for static compilation
    "Cython>=3.0.7",
    
    # Async networking
    "aiohttp>=3.9.1",
    "websockets>=12.0",
    
    # Serialization
    "msgpack>=1.0.7",
    "pyarrow>=14.0.2",
    
    # AMD ROCm/DirectML bindings
    "onnxruntime-directml>=1.16.0; sys_platform == 'win32'",
    "torch>=2.1.1; sys_platform == 'linux'",
    
    # Memory management
    "psutil>=5.9.7",
    
    # Logging and monitoring
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
]

# =============================================================================
# OPTIONAL DEPENDENCIES
# =============================================================================
[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.92.1",
    "mypy>=1.8.0",
    "ruff>=0.1.9",
    "black>=23.12.1",
]

profiling = [
    "py-spy>=0.3.14",
    "memray>=1.10.0",
    "austin-python>=1.2.0",
]

gpu-amd = [
    "rocm-bindings>=5.7.0; sys_platform == 'linux'",
    "hip-python>=5.7.0; sys_platform == 'linux'",
]

# =============================================================================
# RAY CLUSTER CONFIGURATION
# =============================================================================
[tool.ray]
# Default Ray cluster settings for HFT workload
init_args = {
    num_cpus = 12,
    num_gpus = 1,
    memory = 4294967296,  # 4GB Python RAM quota (strict limit)
    object_store_memory = 2147483648,  # 2GB for shared objects
    _temp_dir = "/tmp/ray_hft",
    include_dashboard = false,
    log_to_driver = true,
}

# Actor pool configuration
actor_pool = {
    min_workers = 4,
    max_workers = 8,
    initial_workers = 4,
}

# =============================================================================
# CYTHON COMPILATION SETTINGS
# =============================================================================
[tool.cython]
# Strict Cython compilation for maximum performance
language_level = "3"
binding = true
embedsignature = true
linetrace = false  # Disable for production (enables tracing)
profile = false    # Disable profiling in production
warn = {
    unused = true,
    unused_arg = true,
    unused_result = true,
}

compiler_directives = {
    boundscheck = false,      # Disable bounds checking for speed
    wraparound = false,       # Disable negative index wrapping
    cdivision = true,         # Use C-style division
    overflowcheck = false,    # Disable overflow checks
    embedsignature = true,    # Include docstrings
    language_level = 3,
    always_allow_keywords = false,
    nonecheck = false,        # Disable None checks
    initializedcheck = false, # Disable memoryview init checks
    freethreading_compatible = false,
}

# =============================================================================
# NUMBA JIT COMPILATION SETTINGS
# =============================================================================
[tool.numba]
# Numba configuration for AMD Ryzen AI 5
jit = {
    cache = true,
    nopython = true,
    fastmath = true,
    boundscheck = false,
}

target = "znver4"  # AMD Ryzen AI 5 architecture

# Parallel execution settings
parallel = {
    enabled = true,
    threshold = 1000,
}

# =============================================================================
# WHEEL BUILD SETTINGS
# =============================================================================
[tool.wheel]
# Pre-compile all extensions before Ray cluster boots
py_limited_api = "cp311"
plat_name = "win_amd64"

# Exclude unnecessary files from wheel
exclude = [
    "*.c",
    "*.cpp",
    "*.pyx",
    "*.pxd",
    "*.so",
    "*.dylib",
    "__pycache__",
    "*.pyc",
]

# =============================================================================
# SETUPTOOLS EXTENSION MODULES
# =============================================================================
[tool.setuptools]
packages = ["nautilus_ray", "nautilus_ray.ffi", "nautilus_ray.models"]
zip-safe = false  # Must be false for C-extensions
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.dll", "*.so", "*.pyd", "*.bin"]

# =============================================================================
[tool.setuptools.cmdclass]
# Custom build commands for C-extension compilation
build_ext = "nautilus_ray.build.BuildExtensions"

# =============================================================================
# MYPY TYPE CHECKING
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numba.*", "ray.*", "cython.*"]
ignore_missing_imports = true

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU acceleration",
    "rocm: marks tests requiring AMD ROCm",
    "directml: marks tests requiring DirectML",
    "memory_limit: marks tests enforcing 4GB RAM quota",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# BLACK CODE FORMATTING
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | target
)/
'''

# =============================================================================
# RUFF LINTER CONFIGURATION
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"*.pyx" = ["ALL"]
