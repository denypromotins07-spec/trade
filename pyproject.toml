# =============================================================================
# NAUTILUS/RAY CRYPTO TRADING BOT - PYTHON BUILD CONFIGURATION
# =============================================================================
# Stage 54: Python/Ray Packaging & C-Extension Compilation
# Target: AMD Ryzen AI 5 with ROCm/DirectML GPU offloading
# Memory Constraint: 4GB Python RAM quota during C-extension compilation
# Purpose: Pre-compile all Python hot-paths to native machine code
# =============================================================================

[build-system]
requires = [
    # Core build tools
    "setuptools>=68.0.0",
    "wheel>=0.41.0",
    
    # Cython for compiling Python to C extensions
    "Cython>=3.0.0",
    
    # Numba for JIT compilation of numerical code
    "numba>=0.58.0",
    
    # NumPy for array operations (pinned for reproducibility)
    "numpy==1.26.2",
    
    # PyO3 for Rust-Python FFI bridge
    "maturin>=1.3.0",
    
    # scikit-build for CMake-based builds
    "scikit-build-core>=0.6.0",
    
    # C/C++ compiler toolchain detection
    "ninja>=1.11.0",
]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT METADATA
# =============================================================================

[project]
name = "nautilus-ray-python"
version = "0.1.0"
description = "Python AI modules for Nautilus/Ray crypto trading bot"
readme = "README.md"
license = { text = "PROPRIETARY" }
authors = [
    { name = "Quantitative Trading Systems", email = "dev@nautilus-ray.local" }
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Office/Business :: Financial :: Investment",
]

# =============================================================================
# DEPENDENCIES - PINNED FOR REPRODUCIBILITY
# =============================================================================

dependencies = [
    # Ray distributed computing framework
    "ray[default]>=2.8.0",
    
    # Ray Serve for model serving
    "ray[serve]>=2.8.0",
    
    # Ray Tune for hyperparameter optimization
    "ray[tune]>=2.8.0",
    
    # Machine learning frameworks
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    
    # AMD ROCm support for GPU acceleration (Windows via DirectML)
    "onnxruntime-directml>=1.16.0; sys_platform == 'win32'",
    "onnxruntime-gpu>=1.16.0; sys_platform != 'win32'",
    
    # Numerical computing
    "numpy==1.26.2",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    
    # High-performance data handling
    "pyarrow>=14.0.0",
    "polars>=0.19.0",
    
    # Async HTTP client
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    
    # WebSocket client for market data
    "websockets>=12.0",
    "aiowss>=0.2.0",
    
    # Serialization
    "msgpack>=1.0.7",
    "orjson>=3.9.0",
    
    # Cryptography for API signing
    "cryptography>=41.0.0",
    "pycryptodome>=3.19.0",
    
    # Time handling
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    
    # Logging and monitoring
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    
    # Configuration management
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Type checking
    "typing-extensions>=4.8.0",
]

# Optional dependencies for different deployment modes
[project.optional-dependencies]
gpu = [
    # AMD ROCm bindings (Linux)
    "rocm-bindings>=5.7.0; sys_platform != 'win32'",
    # DirectML for Windows GPU acceleration
    "directml>=1.13.0; sys_platform == 'win32'",
    # CUDA fallback (if NVIDIA GPU present)
    "cupy-cuda12x>=12.0.0",
]

dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    
    # Type checking
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    
    # Code quality
    "ruff>=0.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    
    # Profiling
    "py-spy>=0.3.14",
    "memray>=1.11.0",
]

# =============================================================================
# PROJECT URLS
# =============================================================================

[project.urls]
Homepage = "https://github.com/nautilus-ray/trading-bot"
Documentation = "https://docs.nautilus-ray.local"
Repository = "https://github.com/nautilus-ray/trading-bot.git"
Issues = "https://github.com/nautilus-ray/trading-bot/issues"

# =============================================================================
# SCRIPT ENTRY POINTS
# =============================================================================

[project.scripts]
nautilus-ray-start = "nautilus_ray_python.cli:start"
nautilus-ray-stop = "nautilus_ray_python.cli:stop"
nautilus-ray-status = "nautilus_ray_python.cli:status"
nautilus-ray-replay = "nautilus_ray_python.cli:replay"

# =============================================================================
# SETUPTOOLS CONFIGURATION
# =============================================================================

[tool.setuptools]
packages = ["nautilus_ray_python"]
package-dir = { "" = "python" }
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"*" = ["*.pyx", "*.pxd", "*.h", "*.cpp", "*.cu"]

# =============================================================================
# CYTHON COMPILATION CONFIGURATION
# =============================================================================

[tool.cython]
# Compiler directives for maximum performance
language_level = "3"
boundscheck = false      # Disable bounds checking for speed
wraparound = false       # Disable negative index wrapping
cdivision = true         # Use C division semantics
embedsignature = true    # Include docstrings
linetrace = false        # Disable line tracing for speed
always_allow_keywords = false

# Optimization flags
optimize = "O3"
fast-float = true

# =============================================================================
# NUMBA CONFIGURATION
# =============================================================================

[tool.numba]
# Enable parallel execution
parallel = true

# Target CPU features for AMD Ryzen AI 5
target-cpu = "native"

# Disable bounds checking in production
boundscheck = false

# Enable fast math optimizations
fastmath = true

# Cache compiled functions
cache_dir = ".numba_cache"

# =============================================================================
# MATURIN CONFIGURATION (PyO3 Rust Extensions)
# =============================================================================

[tool.maturin]
# Features to enable in Rust crate
features = ["extension-module"]

# Profile for release builds
profile = "release"

# Strip symbols from binary
strip = true

# Include PGO profiles if available
pgo-profile = "target/pgo/profiles/merged.profdata"

# =============================================================================
# SCIKIT-BUILD-CORE CONFIGURATION
# =============================================================================

[tool.scikit-build]
# Minimum CMake version
cmake.minimum-version = "3.25"

# Build type
build-type = "Release"

# Ninja generator for faster builds
generator = "Ninja"

# Maximum parallel jobs (respect 4GB RAM limit)
max-parallel = 4

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests", "python/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--benchmark-enable",
    "--benchmark-columns=min,max,mean,stddev",
    "--cov=nautilus_ray_python",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["numba.*", "ray.*", "torch.*"]
ignore_missing_imports = true

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files

# =============================================================================
# BLACK CONFIGURATION
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | \.numba_cache
    | build
    | dist
)/
'''

# =============================================================================
# BENCHMARK CONFIGURATION
# =============================================================================

[tool.bench]
# Benchmark output directory
output-dir = "benchmarks/results"

# Number of iterations
iterations = 100

# Warmup iterations
warmup = 10

# Enable CPU cycle counting via rdtscp (Linux only)
enable-cpu-cycles = true

# Memory tracking
track-memory = true
memory-limit-mb = 4096  # Respect 4GB Python quota
