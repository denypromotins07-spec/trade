# =============================================================================
# NAUTILUS/RAY CRYPTO TRADING BOT - HFT CI/CD PIPELINE
# =============================================================================
# Stage 54: Local CI/CD with Micro-benchmark Enforcement
# Target: AMD Ryzen AI 5 with rdtscp CPU cycle counting
# Purpose: Fail builds if hot-path latency regresses by more than 50 nanoseconds
# Constraints: Validate AMD DirectML/ROCm GPU tensor offloading
# =============================================================================

name: HFT Micro-Benchmark CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - '.github/workflows/hft_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.toml'
      - 'pyproject.toml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: "-D warnings"
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "1.75.0"
  
  # Latency regression threshold (nanoseconds)
  LATENCY_REGRESSION_THRESHOLD_NS: 50
  
  # Memory limits
  RUST_MEMORY_LIMIT_MB: 8192
  PYTHON_MEMORY_LIMIT_MB: 4096

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # RUST MICRO-BENCHMARK JOB
  # ===========================================================================
  rust-microbenchmark:
    name: Rust Hot-Path Micro-Benchmarks
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, llvm-tools-preview
          target: x86_64-pc-windows-msvc
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: hft-benchmark
      
      - name: Install benchmark tools
        run: |
          cargo install cargo-criterion
          cargo install cargo-flamegraph
      
      - name: Verify AMD CPU features
        run: |
          rustc --print=cfg --target=x86_64-pc-windows-msvc | findstr "target_feature"
          echo "Checking for AVX2, FMA, BMI2 support..."
          # These should be present on AMD Ryzen AI 5
        shell: cmd
      
      - name: Build in release mode with LTO
        run: cargo build --release --features production
        env:
          RUSTFLAGS: "-C target-cpu=native -C lto=fat -C codegen-units=1"
      
      - name: Run micro-benchmarks with rdtscp timing
        run: cargo bench --bench hot_path_benchmark -- --output-format bencher | tee benchmark_results.txt
        env:
          RUSTFLAGS: "-C target-cpu=native"
          RUST_LOG: info
      
      - name: Parse benchmark results
        id: parse-bench
        run: |
          # Extract baseline from stored results (if available)
          $baselineFile = "benchmarks/baseline_hot_path.json"
          $currentFile = "benchmarks/current_hot_path.json"
          
          # Run benchmarks and capture JSON output
          cargo bench --bench hot_path_benchmark -- --output-format json > $currentFile 2>$null
          
          # Check if baseline exists
          if (Test-Path $baselineFile) {
            Write-Host "Baseline found, comparing..."
            
            # Compare latencies using PowerShell
            $baseline = Get-Content $baselineFile | ConvertFrom-Json
            $current = Get-Content $currentFile | ConvertFrom-Json
            
            $baselineNs = $baseline.hot_path_ns
            $currentNs = $current.hot_path_ns
            $diff = $currentNs - $baselineNs
            
            Write-Host "Baseline: $baselineNs ns"
            Write-Host "Current:  $currentNs ns"
            Write-Host "Delta:    $diff ns"
            
            # Set output variables
            echo "baseline_ns=$baselineNs" >> $env:GITHUB_OUTPUT
            echo "current_ns=$currentNs" >> $env:GITHUB_OUTPUT
            echo "delta_ns=$diff" >> $env:GITHUB_OUTPUT
            
            # Fail if regression exceeds threshold
            $threshold = $env:LATENCY_REGRESSION_THRESHOLD_NS
            if ($diff -gt $threshold) {
              Write-Host "::error::Latency regression of ${diff}ns exceeds threshold of ${threshold}ns"
              exit 1
            } else {
              Write-Host "::notice::Latency within acceptable range"
            }
          } else {
            Write-Host "No baseline found. Creating initial baseline..."
            New-Item -ItemType Directory -Force -Path "benchmarks" | Out-Null
            Copy-Item $currentFile $baselineFile
            echo "baseline_created=true" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-benchmark-results
          path: |
            benchmark_results.txt
            benchmarks/*.json
          retention-days: 30
      
      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Run Rust tests
        run: cargo test --release -- --test-threads=1
      
      - name: Check memory usage during tests
        run: |
          # Monitor memory during test execution
          $maxMemoryMB = 0
          cargo test --release 2>&1 | ForEach-Object {
            $proc = Get-Process -Id $PID -ErrorAction SilentlyContinue
            if ($proc) {
              $memMB = $proc.WorkingSet / 1MB
              if ($memMB -gt $maxMemoryMB) { $maxMemoryMB = $memMB }
            }
            Write-Output $_
          }
          Write-Host "Peak memory: $([math]::Round($maxMemoryMB, 2))MB"
          if ($maxMemoryMB -gt $env:RUST_MEMORY_LIMIT_MB) {
            Write-Host "::error::Memory limit exceeded: ${maxMemoryMB}MB > ${{ env.RUST_MEMORY_LIMIT_MB }}MB"
            exit 1
          }
        shell: pwsh

  # ===========================================================================
  # PYTHON BENCHMARK JOB
  # ===========================================================================
  python-benchmark:
    name: Python/Cython Benchmarks
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython numba numpy pytest pytest-benchmark
          pip install maturin
      
      - name: Check GPU environment
        id: gpu-check
        run: |
          $rocmPath = "C:\Program Files\AMD\ROCm"
          $directmlPath = "C:\Program Files\DirectML"
          
          $hasROCm = Test-Path $rocmPath
          $hasDirectML = Test-Path $directmlPath
          
          Write-Host "ROCm available: $hasROCm"
          Write-Host "DirectML available: $hasDirectML"
          
          echo "has_rocm=$hasROCm" >> $env:GITHUB_OUTPUT
          echo "has_directml=$hasDirectML" >> $env:GITHUB_OUTPUT
          
          # Set environment variables for GPU acceleration
          if ($hasDirectML) {
            echo "ONNXRUNTIME_PROVIDER=directml" >> $env:GITHUB_ENV
          }
        shell: pwsh
      
      - name: Build Cython extensions
        run: |
          if (Test-Path "python/cython_modules") {
            Push-Location python/cython_modules
            python setup.py build_ext --inplace
            Pop-Location
          }
        shell: pwsh
      
      - name: Run Python benchmarks
        run: |
          pytest tests/benchmarks/ --benchmark-json=python_benchmark_results.json --benchmark-columns=min,max,mean,stddev
        env:
          PYTHONMALLOC: malloc
          NUMBA_NUM_THREADS: 4
      
      - name: Validate Python memory usage
        run: |
          # Run memory profiling test
          python -c "
          import tracemalloc
          tracemalloc.start()
          
          # Import and run test
          from tests.benchmarks.memory_test import run_memory_test
          result = run_memory_test()
          
          current, peak = tracemalloc.get_traced_memory()
          tracemalloc.stop()
          
          peak_mb = peak / 1024 / 1024
          print(f'Peak memory: {peak_mb:.2f}MB')
          
          if peak_mb > ${{ env.PYTHON_MEMORY_LIMIT_MB }}:
              print(f'ERROR: Memory limit exceeded')
              exit(1)
          "
        shell: pwsh
      
      - name: Upload Python benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-benchmark-results
          path: python_benchmark_results.json
          retention-days: 30

  # ===========================================================================
  # GPU TENSOR OFFLOADING VALIDATION
  # ===========================================================================
  gpu-validation:
    name: GPU Tensor Offloading Validation
    runs-on: windows-latest
    needs: [rust-microbenchmark, python-benchmark]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install GPU dependencies
        run: |
          pip install torch numpy onnxruntime-directml
        shell: pwsh
      
      - name: Validate DirectML tensor operations
        if: steps.gpu-check.outputs.has_directml == 'true'
        run: |
          python -c "
          import torch
          import onnxruntime as ort
          
          # Check DirectML execution provider
          providers = ort.get_available_providers()
          print(f'Available providers: {providers}')
          
          if 'DirectMLExecutionProvider' not in providers:
              print('WARNING: DirectML provider not available')
          else:
              print('DirectML provider available')
              
              # Run tensor operation test
              session = ort.InferenceSession(
                  'tests/gpu/test_model.onnx',
                  providers=['DirectMLExecutionProvider']
              )
              
              import numpy as np
              input_data = np.random.rand(1, 3, 224, 224).astype(np.float32)
              result = session.run(None, {'input': input_data})
              print(f'Tensor operation successful: {result[0].shape}')
          "
        shell: pwsh
        continue-on-error: true
      
      - name: Validate ROCm bindings (WSL)
        if: steps.gpu-check.outputs.has_rocm == 'true'
        run: |
          echo "ROCm validation would run in WSL environment"
          # In production, this would execute ROCm-specific tests
        shell: pwsh
        continue-on-error: true

  # ===========================================================================
  # INTEGRATION TESTS
  # ===========================================================================
  integration-tests:
    name: State Replay Integration Tests
    runs-on: windows-latest
    needs: [rust-microbenchmark]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run state replay tests
        run: |
          cargo build --release
          python tests/integration/state_replay.py --data tests/data/replay_sample.bin
        shell: pwsh
      
      - name: Verify deterministic execution
        run: |
          # Run replay twice and compare outputs
          python tests/integration/state_replay.py --verify-determinism
        shell: pwsh

  # ===========================================================================
  # MEMORY LEAK FUZZING
  # ===========================================================================
  fuzz-tests:
    name: Memory Leak Fuzzing
    runs-on: windows-latest
    needs: [rust-microbenchmark]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust nightly
        uses: dtolnay/rust-action@nightly
        with:
          toolchain: nightly
      
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      
      - name: Run memory leak fuzzer
        run: |
          # Run fuzzer for limited time in CI
          cargo fuzz run mem_leak -- -max_total_time=60
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      
      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 7

  # ===========================================================================
  # BUILD VERIFICATION
  # ===========================================================================
  build-verification:
    name: PGO Build Verification
    runs-on: windows-latest
    needs: [rust-microbenchmark, python-benchmark]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      
      - name: Run PGO build script
        run: |
          ./scripts/build_pgo.ps1 -Phase instrument -Verbose
        shell: pwsh
      
      - name: Verify binary characteristics
        run: |
          # Check that binary has expected optimizations
          $binary = "target/release/nautilus-ray-bot.exe"
          if (Test-Path $binary) {
            $size = (Get-Item $binary).Length / 1MB
            Write-Host "Binary size: $([math]::Round($size, 2))MB"
            
            # Verify PGO metadata exists
            $pgoDir = "target/pgo/profiles"
            if (Test-Path $pgoDir) {
              Write-Host "PGO profiles generated successfully"
            }
          }
        shell: pwsh
