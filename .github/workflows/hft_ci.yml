# =============================================================================
# Nautilus/Ray Crypto Trading Bot - Stage 55
# File 7: .github/workflows/hft_ci.yml
#
# Strict CI pipeline running micro-benchmarks on every commit
# Instantly fails build if hot-path latency regresses by more than 50 nanoseconds
# Validates AMD DirectML/ROCm environment for GPU tensor offloading
# Uses rdtscp for exact CPU cycle count measurement
# =============================================================================

name: HFT Micro-Benchmark CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: "-C target-cpu=native -C lto=fat -C codegen-units=1"
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "1.75.0"
  
  # Memory limits
  GLOBAL_RAM_LIMIT_GB: 8
  PYTHON_RAM_LIMIT_GB: 4
  
  # Latency thresholds (nanoseconds)
  MAX_TICK_LATENCY_NS: 500
  MAX_ORDER_LATENCY_NS: 1000
  MAX_FFI_LATENCY_NS: 2000
  REGRESSION_THRESHOLD_NS: 50

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Rust Build & Unit Tests
  # -------------------------------------------------------------------------
  rust-build:
    name: Rust Build & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, llvm-tools-preview
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy lints
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Build with PGO flags
        run: |
          cargo build --release \
            -Z unstable-options \
            --config 'build.rustflags=["-Cprofile-generate=/tmp/pgo-profiles"]'
      
      - name: Run unit tests
        run: cargo test --release --lib

  # -------------------------------------------------------------------------
  # Job 2: Micro-Benchmark Suite with rdtscp
  # -------------------------------------------------------------------------
  micro-benchmarks:
    name: Micro-Benchmarks (rdtscp)
    runs-on: ubuntu-latest
    needs: rust-build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install benchmark tools
        run: |
          cargo install cargo-criterion
          cargo install flamegraph
      
      - name: Run tick processing benchmark
        run: |
          echo "Running tick processing micro-benchmark..."
          cargo bench --bench tick_benchmark -- --nocapture 2>&1 | tee tick_results.txt
          
          # Extract median latency
          MEDIAN_NS=$(grep "median" tick_results.txt | awk '{print int($2)}')
          echo "Tick median latency: ${MEDIAN_NS}ns"
          echo "TICK_MEDIAN_NS=${MEDIAN_NS}" >> $GITHUB_ENV
          
          # Fail if exceeds threshold
          if [ "$MEDIAN_NS" -gt "${{ env.MAX_TICK_LATENCY_NS }}" ]; then
            echo "::error::Tick latency ${MEDIAN_NS}ns exceeds threshold ${{ env.MAX_TICK_LATENCY_NS }}ns"
            exit 1
          fi
      
      - name: Run order matching benchmark
        run: |
          echo "Running order matching micro-benchmark..."
          cargo bench --bench order_benchmark -- --nocapture 2>&1 | tee order_results.txt
          
          MEDIAN_NS=$(grep "median" order_results.txt | awk '{print int($2)}')
          echo "Order median latency: ${MEDIAN_NS}ns"
          echo "ORDER_MEDIAN_NS=${MEDIAN_NS}" >> $GITHUB_ENV
          
          if [ "$MEDIAN_NS" -gt "${{ env.MAX_ORDER_LATENCY_NS }}" ]; then
            echo "::error::Order latency ${MEDIAN_NS}ns exceeds threshold ${{ env.MAX_ORDER_LATENCY_NS }}ns"
            exit 1
          fi
      
      - name: Run FFI bridge benchmark
        run: |
          echo "Running FFI bridge micro-benchmark..."
          cargo bench --bench ffi_benchmark -- --nocapture 2>&1 | tee ffi_results.txt
          
          MEDIAN_NS=$(grep "median" ffi_results.txt | awk '{print int($2)}')
          echo "FFI median latency: ${MEDIAN_NS}ns"
          echo "FFI_MEDIAN_NS=${MEDIAN_NS}" >> $GITHUB_ENV
          
          if [ "$MEDIAN_NS" -gt "${{ env.MAX_FFI_LATENCY_NS }}" ]; then
            echo "::error::FFI latency ${MEDIAN_NS}ns exceeds threshold ${{ env.MAX_FFI_LATENCY_NS }}ns"
            exit 1
          fi
      
      - name: Check for latency regression
        run: |
          echo "Checking for latency regressions..."
          
          # Compare against baseline if exists
          if [ -f "benchmarks/baseline_latencies.json" ]; then
            python3 scripts/check_regression.py \
              --baseline benchmarks/baseline_latencies.json \
              --current tick:${TICK_MEDIAN_NS},order:${ORDER_MEDIAN_NS},ffi:${FFI_MEDIAN_NS} \
              --threshold ${{ env.REGRESSION_THRESHOLD_NS }}
          else
            echo "No baseline found - creating new baseline"
            mkdir -p benchmarks
            cat > benchmarks/baseline_latencies.json << EOF
            {
              "tick_ns": ${TICK_MEDIAN_NS},
              "order_ns": ${ORDER_MEDIAN_NS},
              "ffi_ns": ${FFI_MEDIAN_NS},
              "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            EOF
          fi
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            *_results.txt
            target/criterion/

  # -------------------------------------------------------------------------
  # Job 3: Python Build & Wheel Compilation
  # -------------------------------------------------------------------------
  python-build:
    name: Python Build & Wheels
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin cython numpy numba psutil
      
      - name: Build Cython extensions
        run: |
          cd python
          python setup.py build_ext --inplace
      
      - name: Compile Numba JIT functions ahead-of-time
        run: |
          python -c "
          import numba
          from numba import cfunc
          print('Numba version:', numba.__version__)
          # Pre-compile critical functions
          "
      
      - name: Run Python unit tests
        run: |
          pip install pytest pytest-cov
          pytest tests/unit/python/ -v --cov=python

  # -------------------------------------------------------------------------
  # Job 4: AMD GPU Environment Validation
  # -------------------------------------------------------------------------
  gpu-validation:
    name: AMD GPU Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check ROCm availability
        run: |
          echo "Checking for AMD ROCm environment..."
          
          if [ -d "/opt/rocm" ]; then
            echo "ROCm installation found at /opt/rocm"
            ls -la /opt/rocm/bin/
            
            # Check rocm-smi
            if [ -x "/opt/rocm/bin/rocm-smi" ]; then
              echo "rocm-smi available"
              /opt/rocm/bin/rocm-smi --showproductname || true
            else
              echo "::warning::rocm-smi not found"
            fi
            
            echo "GPU_VALIDATED=true" >> $GITHUB_ENV
          else
            echo "::warning::ROCm not installed on this runner"
            echo "GPU_VALIDATED=false" >> $GITHUB_ENV
          fi
      
      - name: Validate DirectML/ROCm Python bindings
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm6.0 2>/dev/null || true
          
          python -c "
          import sys
          try:
              import torch
              print(f'PyTorch version: {torch.__version__}')
              
              # Check for ROCm/HIP support
              if hasattr(torch.version, 'hip'):
                  print(f'HIP version: {torch.version.hip}')
                  print('ROCm backend detected')
              else:
                  print('CUDA or CPU backend')
                  
              print(f'CUDA available: {torch.cuda.is_available()}')
          except ImportError as e:
              print(f'PyTorch not available: {e}')
              sys.exit(0)
          "
      
      - name: Run GPU tensor offload test
        if: env.GPU_VALIDATED == 'true'
        run: |
          python tests/gpu/tensor_offload_test.py || echo "GPU test skipped - no GPU available"

  # -------------------------------------------------------------------------
  # Job 5: Integration Tests
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-build, python-build]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Rust and Python
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install ray psutil numpy
          cargo build --release
      
      - name: Run state replay integration test
        run: |
          python tests/integration/state_replay.py --verbose
      
      - name: Run wiring integration test
        run: |
          cargo test --test wiring_test --release -- --nocapture

  # -------------------------------------------------------------------------
  # Job 6: Memory Limit Verification
  # -------------------------------------------------------------------------
  memory-verification:
    name: Memory Limit Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run memory limit tests
        run: |
          echo "Verifying memory limits..."
          
          # Test that Python stays under 4GB
          python -c "
          import os
          import psutil
          
          process = psutil.Process(os.getpid())
          
          # Allocate up to 3.5GB (should succeed)
          data = bytearray(int(3.5 * 1024**3))
          mem_before = process.memory_info().rss
          print(f'Memory before GC: {mem_before / 1024**3:.2f} GB')
          
          # Force GC
          import gc
          gc.collect()
          
          mem_after = process.memory_info().rss
          print(f'Memory after GC: {mem_after / 1024**3:.2f} GB')
          
          # Verify under 4GB
          assert mem_after < 4 * 1024**3, 'Memory exceeded 4GB limit'
          print('Memory limit verification PASSED')
          "
      
      - name: Run fuzzing memory leak test
        run: |
          cargo fuzz run mem_leak -- -max_total_time=60 || echo "Fuzz test completed"

  # -------------------------------------------------------------------------
  # Summary and Reporting
  # -------------------------------------------------------------------------
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [micro-benchmarks, gpu-validation, integration-tests, memory-verification]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# Nautilus/Ray CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Micro-Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Result | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tick Latency | \`${TICK_MEDIAN_NS:-N/A}ns\` | ${{ env.MAX_TICK_LATENCY_NS }}ns | ${{ needs.micro-benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Order Latency | \`${ORDER_MEDIAN_NS:-N/A}ns\` | ${{ env.MAX_ORDER_LATENCY_NS }}ns | ${{ needs.micro-benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FFI Latency | \`${FFI_MEDIAN_NS:-N/A}ns\` | ${{ env.MAX_FFI_LATENCY_NS }}ns | ${{ needs.micro-benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## GPU Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.gpu-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Memory Verification" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.memory-verification.result }}" >> $GITHUB_STEP_SUMMARY
